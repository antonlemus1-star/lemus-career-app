<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lemus Career Agent</title>
    <!-- Жёсткая защита от кэша -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-primary: #0f0f1a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --gradient-main: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --radius-card: 20px;
            --radius-button: 16px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 30px 0 20px; }
        .logo { width: 80px; height: 80px; margin: 0 auto 16px; background: var(--gradient-main); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 10px 40px rgba(102,126,234,0.4); }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .user-greeting { display: inline-block; margin-top: 12px; padding: 8px 20px; background: var(--bg-card); border-radius: 30px; font-size: 14px; color: var(--text-secondary); }
        
        /* Статус загрузки */
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .screen { display: none; }
        .screen.active { display: block; animation: fadeInUp 0.35s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .feature-grid { display: grid; gap: 12px; margin-top: 20px; }
        .feature-card {
            display: flex; align-items: center; gap: 16px; padding: 18px;
            background: var(--bg-card); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-card); cursor: pointer;
        }
        .feature-card.highlight {
            background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2));
            border: 1px solid rgba(102,126,234,0.4);
        }
        .feature-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; background: rgba(255,255,255,0.1); }
        .feature-info { flex: 1; }
        .feature-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .feature-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
        
        .action-button {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px 24px; border-radius: var(--radius-button);
            font-size: 16px; font-weight: 600; cursor: pointer; color: white; border: none; width: 100%;
            background: var(--gradient-main); margin-top: 20px;
        }
        .back-button {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px;
            background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-button);
            color: var(--text-primary); font-size: 15px; cursor: pointer; margin-bottom: 20px;
        }
        
        /* Результаты */
        .result-card { padding: 20px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-card); margin-bottom: 16px; }
        .vacancy-card { padding: 16px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-card); margin-bottom: 12px; }
        .vacancy-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .vacancy-company { font-size: 14px; color: var(--text-secondary); }
        .link-item { display: block; padding: 12px 16px; background: rgba(79,172,254,0.1); border-radius: 12px; color: #4facfe; text-decoration: none; font-size: 14px; margin-top: 8px; }
        
        .error-msg { color: #ff6b6b; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div style="font-size: 14px;">Загрузка...</div>
    </div>

    <div class="container">
        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div class="screen active" id="screen-home">
            <div class="header">
                <div class="logo">🚀</div>
                <h1>Lemus Career</h1>
                <p style="color: var(--text-secondary);">ИИ-помощник для поиска работы</p>
                <div class="user-greeting" id="userGreeting">👋 Привет!</div>
            </div>

            <div class="feature-grid">
                <!-- 🔥 ГЛАВНАЯ ФУНКЦИЯ СВЕРХУ -->
                <div class="feature-card highlight" onclick="runSearch()">
                    <div class="feature-icon">🔍</div>
                    <div class="feature-info">
                        <div class="feature-name">Поиск вакансий</div>
                        <div class="feature-desc">Подбор по резюме и региону</div>
                    </div>
                </div>
                
                <div class="feature-card" onclick="showScreen('analyze')">
                    <div class="feature-icon">🔗</div>
                    <div class="feature-info">
                        <div class="feature-name">Разобрать вакансию</div>
                        <div class="feature-desc">Контакты ЛПР и питч</div>
                    </div>
                </div>

                <div class="feature-card" onclick="openBot()">
                    <div class="feature-icon">💬</div>
                    <div class="feature-info">
                        <div class="feature-name">Открыть бота</div>
                        <div class="feature-desc">Все функции в чате</div>
                    </div>
                </div>
            </div>
            
            <div id="homeResult"></div>
        </div>

        <!-- ЭКРАН АНАЛИЗА ВАКАНСИИ -->
        <div class="screen" id="screen-analyze">
            <div class="back-button" onclick="showScreen('home')">← Назад</div>
            <div class="screen-title" style="font-size: 24px; font-weight: bold; margin-bottom: 16px;">🔗 Разбор вакансии</div>
            <textarea class="input-field" id="vacancyInput" placeholder="Вставь текст вакансии..." style="width: 100%; height: 150px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; color: white; resize: none;"></textarea>
            <button class="action-button" onclick="runAnalyze()">🔍 Разобрать (2 ⭐)</button>
            <div id="analyzeResult"></div>
        </div>
    </div>

    <script>
        const BOT_API_URL = "https://lemus-career-bot.onrender.com"; 
        const tg = window.Telegram && window.Telegram.WebApp;
        let currentUserId = null;

        // === ИНИЦИАЛИЗАЦИЯ ===
        if (tg) {
            try {
                tg.ready();
                tg.expand();
                const user = tg.initDataUnsafe?.user;
                if (user) document.getElementById('userGreeting').textContent = `👋 Привет, ${user.first_name}!`;
            } catch(e) {}
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
        }

        function showError(containerId, msg) {
            const el = document.getElementById(containerId);
            if(el) el.innerHTML = `<div class="error-msg">❌ ${msg}</div>`;
        }

        // === АВТОРИЗАЦИЯ (ЖЁСТКАЯ ПРОВЕРКА) ===
        async function authenticate() {
            if (!tg || !tg.initData) return false;
            
            try {
                const res = await fetch(`${BOT_API_URL}/miniapp/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: tg.initData })
                });
                
                const data = await res.json();
                
                if (data.ok && data.user_id) {
                    currentUserId = data.user_id;
                    return true;
                } else {
                    console.error("Auth failed:", data);
                    return false;
                }
            } catch (e) {
                console.error("Network error during auth:", e);
                return false;
            }
        }

        // === ПОИСК ВАКАНСИЙ ===
        async function runSearch() {
            showLoader(true);
            document.getElementById('homeResult').innerHTML = '';
            
            const isAuthed = await authenticate();
            if (!isAuthed) {
                showLoader(false);
                alert("⚠️ Не удалось войти. Попробуй закрыть приложение и открыть заново.");
                return;
            }

            try {
                const res = await fetch(`${BOT_API_URL}/miniapp/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId })
                });
                
                const data = await res.json();
                showLoader(false);

                if (!res.ok) throw new Error(data.error || "Ошибка сервера");
                
                renderVacancies(data.vacancies || []);
            } catch (e) {
                showLoader(false);
                showError('homeResult', e.message);
            }
        }

        function renderVacancies(vacs) {
            const container = document.getElementById('homeResult');
            if (!vacs.length) {
                container.innerHTML = '<div style="padding:20px;text-align:center;color:#aaa;">Нет вакансий. Загрузи резюме через бота.</div>';
                return;
            }
            
            let html = '<div style="margin-top:20px;font-weight:bold;margin-bottom:10px;">Найдено вакансий:</div>';
            vacs.slice(0, 5).forEach(v => {
                html += `
                <div class="vacancy-card">
                    <div class="vacancy-title">${v.title}</div>
                    <div class="vacancy-company">${v.company} • ${v.salary || 'З/P не указана'}</div>
                    <a href="${v.url}" target="_blank" class="link-item">🔗 Открыть на HH.ru</a>
                </div>`;
            });
            container.innerHTML = html;
        }

        // === РАЗБОР ВАКАНСИИ ===
        async function runAnalyze() {
            const text = document.getElementById('vacancyInput').value.trim();
            if (text.length < 50) {
                alert("Текст слишком короткий!");
                return;
            }
            
            showLoader(true);
            const isAuthed = await authenticate();
            if (!isAuthed) {
                showLoader(false);
                alert("Ошибка входа.");
                return;
            }

            try {
                const res = await fetch(`${BOT_API_URL}/miniapp/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, vacancy_text: text })
                });
                
                const data = await res.json();
                showLoader(false);

                if (!res.ok) throw new Error(data.error || "Ошибка анализа");
                
                document.getElementById('analyzeResult').innerHTML = `
                    <div class="result-card">
                        <div style="font-weight:bold;margin-bottom:8px;">${data.company} — ${data.title}</div>
                        <div style="background:rgba(255,255,255,0.05);padding:12px;border-radius:8px;margin-top:10px;">
                            <strong>Питч:</strong><br>${data.pitch}
                        </div>
                    </div>`;
                    
            } catch (e) {
                showLoader(false);
                showError('analyzeResult', e.message);
            }
        }

        function openBot() {
            if (tg) tg.openTelegramLink('https://t.me/LemusCareer_Bot');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${id}`).classList.add('active');
        }
    </script>
</body>
</html>
